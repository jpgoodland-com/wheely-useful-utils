name: App Container ECS Deployment

on:
  workflow_run:
    workflows: ["Terraform Infrastructure"]
    branches: [release]
    types: [completed]
  # Manual redeploy (e.g. after a failed run).
  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    # Only run if the Terraform workflow succeeded, or when run by hand
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    
    env:
      AWS_DEFAULT_REGION: ${{ vars.AWS_DEFAULT_REGION }}
      ECR_REPOSITORY: wheel-app
      ECS_CLUSTER: wheel-app
      ECS_SERVICE: wheel-app
    
    steps:
    - name: Checkout Code
      uses: actions/checkout@v5

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ vars.AWS_DEFAULT_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    # Layers are cached in ECR under the `buildcache` tag, so a deploy that
    # doesn't change package-lock.json skips `npm ci`. The GitHub Actions
    # cache can't be used here: GitHub issues read-only cache tokens to
    # `workflow_run` jobs on the default branch, and buildx fails the build
    # when its cache export is denied. `ignore-error=true` keeps a cache
    # problem from blocking a deploy.
    - name: Build, tag, and push image to Amazon ECR
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        tags: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
        cache-from: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache
        cache-to: type=registry,ref=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true

    - name: Force new deployment of ECS service
      run: |
        aws ecs update-service --cluster $ECS_CLUSTER --service $ECS_SERVICE --force-new-deployment
